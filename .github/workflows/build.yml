name: Build TWRP for k62v1_64_bsp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 ccache

      - name: 安装 repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 同步 TWRP 源码
        run: |
          mkdir twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j8 --force-sync --no-clone-bundle --no-tags
          df -h

      - name: 放入设备树
        run: |
          cd twrp
          mkdir -p device/alps
          curl -L -o dt.zip https://github.com/qinxingmanye/twrp_device_k62v1_64_bsp/raw/main/k62v1_64_bsp.zip
          unzip -q dt.zip -d device/alps/
          printf 'LOCAL_PATH := device/alps/k62v1_64_bsp\n' > device/alps/k62v1_64_bsp/device.mk
          echo 'vendor configs:'
          ls vendor/ 2>/dev/null || true
          if [ -f vendor/twrp/config/common.mk ]; then cfg=vendor/twrp/config/common.mk
          elif [ -f vendor/omni/config/common.mk ]; then cfg=vendor/omni/config/common.mk
          else cfg=""; fi
          echo "using cfg: $cfg"
          if [ -n "$cfg" ]; then
            sed -i "s#vendor/omni/config/common.mk#$cfg#" device/alps/k62v1_64_bsp/omni_k62v1_64_bsp.mk
          else
            sed -i '/vendor\/omni\/config\/common.mk/d' device/alps/k62v1_64_bsp/omni_k62v1_64_bsp.mk
          fi
          grep inherit device/alps/k62v1_64_bsp/omni_k62v1_64_bsp.mk
          ls -la device/alps/k62v1_64_bsp | head

      - name: 打补丁
        run: |
          cd twrp
          BC=$(find device -name BoardConfig.mk | head -1)
          echo "BoardConfig: $BC"
          echo 'TW_DEFAULT_LANGUAGE := zh_CN' >> "$BC"
          echo 'TW_NO_HAPTICS := true' >> "$BC"
          tail -3 "$BC"
          sed -i 's#/sys/class/power_supply/battery#/sys/class/power_supply/mtk-gauge#g' bootable/recovery/twrp.cpp
          sed -i 's/"tw_brightness_pct", "100"/"tw_brightness_pct", "50"/' bootable/recovery/data.cpp
          grep -c mtk-gauge bootable/recovery/twrp.cpp
      - name: 编译
        run: |
          cd twrp
          if [ -d device/alcatel/k62v1_64_bsp ]; then mv device/alcatel/k62v1_64_bsp device/alcatel/k62v1_64_bsp.bak; fi
          echo 'remaining omni trees:'
          find device -maxdepth 3 -name 'omni_k62v1_64_bsp.mk'
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_k62v1_64_bsp-eng
          mka bootimage -j8 || mka recoveryimage -j8
          ls -l out/target/product/k62v1_64_bsp/*.img || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image
          path: twrp/out/target/product/k62v1_64_bsp/*.img
